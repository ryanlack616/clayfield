name: ci

# One job, one gate: `scripts/check.sh`. The script is the single source of
# truth so CI and a local run cannot drift — the same commands, the same order,
# the same failure. Edit the script, not this file.

on:
  push:
    paths:
      - 'mesh-forge/**'
      - 'clayfield-web/**'
      - 'docs/**'
      - 'scripts/**'
      - '.githooks/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'mesh-forge/**'
      - 'clayfield-web/**'
      - 'docs/**'
      - 'scripts/**'
      - '.github/workflows/**'

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: mesh-forge/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: install workspace
        working-directory: mesh-forge
        run: pnpm install --frozen-lockfile
      - name: gate
        run: scripts/check.sh
