[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clayfield"
version = "2.0.0"
description = "Image-to-heightfield and 3D relief generation software"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.6",
    "PyOpenGL>=3.1",
    "PyOpenGL-accelerate>=3.1",
    "numpy>=2.0",
    "opencv-python>=4.8",
    "Pillow>=10.0",
    "scipy>=1.11",
    "trimesh>=4.0",
]

[project.scripts]
clayfield = "clayfield.app.application:run"

[project.optional-dependencies]
test = ["pytest>=8", "lib3mf>=2.4; platform_system == 'Linux' and platform_machine == 'x86_64'"]
bundle = ["pyinstaller>=6.11"]
dev = ["ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# The codebase deliberately uses long explanatory comments and docstrings;
# wrapping them for a column limit would hurt readability more than it helps.
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["clayfield"]

[tool.ruff.lint.per-file-ignores]
# PyOpenGL's public API is conventionally star-imported; every GL constant and
# function in these modules resolves through that import.
"src/clayfield/ui/viewport.py" = ["F403", "F405"]
"src/clayfield/ui/gpu_pipeline.py" = ["F403", "F405"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
clayfield = ["resources/*.vert", "resources/*.frag"]
