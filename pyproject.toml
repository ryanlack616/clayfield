[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clayfield"
version = "2.0.0"
description = "Image-to-heightfield and 3D relief generation software"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.6",
    "PyOpenGL>=3.1",
    "PyOpenGL-accelerate>=3.1",
    "numpy>=2.0",
    "opencv-python>=4.8",
    "Pillow>=10.0",
    "scipy>=1.11",
    "trimesh>=4.0",
]

[project.scripts]
clayfield = "clayfield.app.application:run"

[project.optional-dependencies]
test = ["pytest>=8", "lib3mf>=2.4; platform_system == 'Linux' and platform_machine == 'x86_64'"]
bundle = ["pyinstaller>=6.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
clayfield = ["resources/*.vert", "resources/*.frag"]
